<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="icon" type="image/svg+xml" href="./assets/cinemaci.svg">
    <title>Cinemaci</title>
</head>
<body>
    <div class="container">
        <!-- Hamburger menu when screen is smaller with media query and display none when screen is larger -->
        <nav class="nav" aria-label="Main navigation">
            <a href="/" class="logo logo-bar"><img class="logo-img" src="assets/cinemaci.svg" alt="Logo" width="150" height="150"/></a>
            <input type="checkbox" id="menu-toggle" class="menu-toggle"/>
            <label for="menu-toggle" class="menu-button">
                <img class="menu-burger" src="assets/favicon.svg" alt="Menu" width="28" height="28"/>
            </label>

            <div class="nav-menu">
                <a href="/" class="logo"><img class="logo-img" src="assets/cinemaci.svg" alt="Logo" width="150" height="150"/></a>

                <ul class="nav-links">
                  <li><a href="/">Home</a></li>
                  <li><a href="/movies">Movies</a></li>
                  <li><a href="/series">Series</a></li>
                  <li><a href="/anime">Anime</a></li>
                  <li><a href="/tv-shows">TV-Shows</a></li>
                  <li><a href="/about">About</a></li>
                </ul>
            </div>

            <label for="menu-toggle" class="menu-backdrop" aria-hidden="true"></label>
          </nav>



        <!-- Cards with movie details -->
        <div class="cards">
            <h2>Movies Card</h2>
        </div>



        <!-- Footer with ticket style -->
        <footer class="site-footer">
            <div class="ticket">
                <div class="ticket-main">
                    <div class="ticket-top">
                        <h2 class="ticket-title">Cinema Ticket</h2>
                        <time class="ticket-date" datetime="2026-09-18">18 October, 2026</time>
                        <time class="ticket-time" datetime="20:00">08:00 PM</time>

                        <div class="stamp" aria-hidden="true">
                            <div class="stamp-card">
                                <div class="stamp-inner">
                                    <span class="material-symbols-outlined stamp-icon">videocam</span>
                                    <p class="stamp-text">
                                        <span class="stamp-title">Cinema Ticket</span>
                                        <span class="stamp-admit">Admit One</span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="ticket-divider"/>

                    <div class="ticket-bottom">
                        <p class="ticket-seat">
                            <span>Row: B</span>
                            <span>Seat: 08</span>
                        </p>
                        <address class="ticket-address">
                            Rimberio Cinema,<br/>
                            123 Anywhere St., Any City
                        </address>
                    </div>
                </div>

                <div class="ticket-stub">
                    <p class="stub-seat" aria-hidden="true">
                        <span>Row: B</span>
                        <span>Seat: 08</span>
                    </p>
                    <div class="barcode" aria-hidden="true"></div>
                    <p class="stub-admit">Admit One</p>
                </div>
            </div>
         </footer>
    </div>
    
</body>
</html>
